name: abcfold-npf-clustering
# Headless conformational clustering (worflows/postprocessing/Snakefile
# stage 8, scripts/cluster_conformations.py) -- non-interactive port of
# envs/notebook.yaml's scientific stack, minus the notebook/widget runtime
# (jupyterlab/ipykernel/ipywidgets/anywidget) which that stage never needs.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pandas>=2.0
  - numpy>=1.26
  - pyarrow>=15.0         # reads meta.parquet/resids.parquet, writes assignments.parquet
  - scikit-learn>=1.4     # PCA, GaussianMixture
  - plotly>=5.20           # static scatter/histogram/BIC-curve figures
  - kneed>=0.8              # BIC-knee detection for GMM auto-k
  - gemmi>=0.7               # reads raw CIF Ca + ligand atom coordinates for ligand-pose clustering
  - pip
  - pip:
      - kaleido>=0.2        # static SVG export for plotly figures
